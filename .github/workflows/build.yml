name: Build and Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest

    env:
      APPLE_SIGNING_IDENTITY: "Developer ID Application: zhonghui li (JSRAB4F28W)"
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          CERT_PATH=$RUNNER_TEMP/apple_cert.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm "$CERT_PATH"

      - name: Setup notarization API key
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build Tauri app
        run: npm run tauri build

      - name: Notarize DMG
        run: |
          DMG=$(ls "src-tauri/target/release/bundle/dmg/"*.dmg | head -1)
          echo "Notarizing: $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "${{ secrets.APPLE_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER }}" \
            --wait

      - name: Staple notarization ticket
        run: |
          DMG=$(ls "src-tauri/target/release/bundle/dmg/"*.dmg | head -1)
          echo "Stapling: $DMG"
          xcrun stapler staple "$DMG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sf-devkit-macos-aarch64
          path: |
            src-tauri/target/release/bundle/
          if-no-files-found: warn

  # --- Release on tag push ---
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Compose release notes from tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch tag object via GitHub API. We can't rely on
          # `git tag -l --format='%(contents)'` here because actions/checkout
          # does a shallow fetch and the annotated tag's message body is not
          # present in the local clone — that would silently fall back to the
          # pointed-to commit's message.
          set -euo pipefail
          REF="repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}"
          OBJECT_SHA=$(gh api "$REF" --jq '.object.sha')
          OBJECT_TYPE=$(gh api "$REF" --jq '.object.type')
          if [ "$OBJECT_TYPE" = "tag" ]; then
            TAG_MESSAGE=$(gh api "repos/${{ github.repository }}/git/tags/${OBJECT_SHA}" --jq '.message')
          else
            # lightweight tag — fall back to commit message
            TAG_MESSAGE=$(gh api "repos/${{ github.repository }}/commits/${OBJECT_SHA}" --jq '.commit.message')
          fi
          {
            printf '%s\n' "$TAG_MESSAGE"
            echo ""
            echo "---"
            echo ""
            echo "## 安装"
            echo ""
            echo "将 \`.dmg\` 拖入 Applications 文件夹即可安装。"
          } > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SF DevKit ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            sf-devkit-macos-aarch64/**/*.dmg
          generate_release_notes: true
