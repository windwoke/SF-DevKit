name: Build and Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    # The build itself finishes in ~11 min. This cap is a safety net: the
    # failure mode is codesign hanging on a headless keychain auth prompt,
    # which would otherwise burn the full 6h job limit before timing out.
    timeout-minutes: 30

    env:
      APPLE_SIGNING_IDENTITY: "Developer ID Application: zhonghui li (JSRAB4F28W)"
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          CERT_PATH=$RUNNER_TEMP/apple_cert.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          # A non-empty keychain password is required: with an empty one the
          # partition list is unreliable and codesign can hang on an invisible
          # GUI authorization prompt for the private key in headless CI
          # (macos-latest). The keychain is per-job and discarded afterwards,
          # so a freshly generated password is fine.
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain
          rm "$CERT_PATH"

      - name: Setup notarization API key
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build Tauri app
        run: npm run tauri build

      - name: Notarize DMG
        run: |
          DMG=$(ls "src-tauri/target/release/bundle/dmg/"*.dmg | head -1)
          echo "Notarizing: $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "${{ secrets.APPLE_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER }}" \
            --wait

      - name: Staple notarization ticket
        run: |
          DMG=$(ls "src-tauri/target/release/bundle/dmg/"*.dmg | head -1)
          echo "Stapling: $DMG"
          xcrun stapler staple "$DMG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sf-devkit-macos-aarch64
          path: |
            src-tauri/target/release/bundle/
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest

    env:
      # This signs the Tauri updater payload. It is separate from Windows
      # Authenticode signing, which can be added later when a publisher
      # certificate or Microsoft Store distribution is available.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sf-devkit-windows-x86_64
          path: |
            src-tauri/target/release/bundle/
          if-no-files-found: error

  # --- Release on tag push ---
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Compose release notes from tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch tag object via GitHub API. We can't rely on
          # `git tag -l --format='%(contents)'` here because actions/checkout
          # does a shallow fetch and the annotated tag's message body is not
          # present in the local clone — that would silently fall back to the
          # pointed-to commit's message.
          set -euo pipefail
          REF="repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}"
          OBJECT_SHA=$(gh api "$REF" --jq '.object.sha')
          OBJECT_TYPE=$(gh api "$REF" --jq '.object.type')
          if [ "$OBJECT_TYPE" = "tag" ]; then
            TAG_MESSAGE=$(gh api "repos/${{ github.repository }}/git/tags/${OBJECT_SHA}" --jq '.message')
          else
            # lightweight tag — fall back to commit message
            TAG_MESSAGE=$(gh api "repos/${{ github.repository }}/commits/${OBJECT_SHA}" --jq '.commit.message')
          fi
          {
            printf '%s\n' "$TAG_MESSAGE"
            echo ""
            echo "---"
            echo ""
            echo "## 安装"
            echo ""
            echo "将 \`.dmg\` 拖入 Applications 文件夹即可安装。"
          } > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      - name: Prepare signed updater assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_DIR="release-assets"
          mkdir -p "$RELEASE_DIR"

          MAC_UPDATER=$(find sf-devkit-macos-aarch64 -type f -name '*.app.tar.gz' -print -quit)
          WINDOWS_UPDATER=$(find sf-devkit-windows-x86_64 -type f -path '*/nsis/*' -name '*.exe' -print -quit)
          test -n "$MAC_UPDATER" && test -f "$MAC_UPDATER"
          test -n "$WINDOWS_UPDATER" && test -f "$WINDOWS_UPDATER"
          test -f "${MAC_UPDATER}.sig"
          test -f "${WINDOWS_UPDATER}.sig"

          MAC_ASSET="sf-devkit_${VERSION}_aarch64.app.tar.gz"
          WINDOWS_ASSET="sf-devkit_${VERSION}_x64-setup.exe"
          cp "$MAC_UPDATER" "$RELEASE_DIR/$MAC_ASSET"
          cp "${MAC_UPDATER}.sig" "$RELEASE_DIR/$MAC_ASSET.sig"
          cp "$WINDOWS_UPDATER" "$RELEASE_DIR/$WINDOWS_ASSET"
          cp "${WINDOWS_UPDATER}.sig" "$RELEASE_DIR/$WINDOWS_ASSET.sig"

          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          MAC_SIGNATURE=$(tr -d '\n' < "$RELEASE_DIR/$MAC_ASSET.sig")
          WINDOWS_SIGNATURE=$(tr -d '\n' < "$RELEASE_DIR/$WINDOWS_ASSET.sig")
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg macUrl "$RELEASE_BASE/$MAC_ASSET" \
            --arg macSignature "$MAC_SIGNATURE" \
            --arg windowsUrl "$RELEASE_BASE/$WINDOWS_ASSET" \
            --arg windowsSignature "$WINDOWS_SIGNATURE" \
            '{version: $version, pub_date: $date, notes: "See the GitHub Release for details.", platforms: {"darwin-aarch64": {url: $macUrl, signature: $macSignature}, "windows-x86_64": {url: $windowsUrl, signature: $windowsSignature}}}' \
            > "$RELEASE_DIR/latest.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SF DevKit ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            sf-devkit-macos-aarch64/**/*.dmg
            release-assets/latest.json
            release-assets/*.app.tar.gz
            release-assets/*-setup.exe
          generate_release_notes: true
