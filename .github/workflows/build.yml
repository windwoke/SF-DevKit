name: Build and Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    env:
      APPLE_SIGNING_IDENTITY: "Developer ID Application: zhonghui li (JSRAB4F28W)"
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          CERT_PATH=$RUNNER_TEMP/apple_cert.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm "$CERT_PATH"

      - name: Setup notarization API key
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build Tauri app
        run: npm run tauri build

      - name: Notarize DMG
        run: |
          DMG=$(ls "src-tauri/target/release/bundle/dmg/"*.dmg | head -1)
          echo "Notarizing: $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "${{ secrets.APPLE_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER }}" \
            --wait

      - name: Staple notarization ticket
        run: |
          DMG=$(ls "src-tauri/target/release/bundle/dmg/"*.dmg | head -1)
          echo "Stapling: $DMG"
          xcrun stapler staple "$DMG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sf-devkit-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/
          if-no-files-found: warn

  # --- Release on tag push ---
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (to read tag annotation)
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Compose release notes from tag annotation
        run: |
          {
            git tag -l --format='%(contents)' "${{ github.ref_name }}"
            echo ""
            echo "---"
            echo ""
            echo "## 安装"
            echo ""
            echo "将 \`.dmg\` 拖入 Applications 文件夹即可安装。"
          } > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SF DevKit ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            sf-devkit-*/**/*.dmg
          generate_release_notes: true
